<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>질문 상세 - KoKive</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .qna-detail { display: flex; flex-direction: column; gap: 1rem; }
        .qna-card { background: var(--bg-light, #ffffff); border: 1px solid var(--border-color, #dddddd); border-radius: 8px; padding: 1.5rem; }
        .qna-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; gap: 0.5rem; }
        .qna-title { font-size: 1.25rem; font-weight: 600; color: var(--text-primary, #000000); flex: 1; line-height: 1.4; }
        .qna-badge { padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.75rem; font-weight: 500; white-space: nowrap; }
        .qna-badge.answered { background: #d4edda; color: #155724; }
        .qna-badge.pending { background: #fff3cd; color: #856404; }
        .qna-meta { display: flex; gap: 1rem; color: var(--text-secondary, #888888); font-size: 0.85rem; margin-top: 0.75rem; flex-wrap: wrap; }
        .qna-meta span { display: flex; align-items: center; gap: 0.25rem; }
        .qna-content { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-color, #eee); color: var(--text-primary, #333); line-height: 1.7; white-space: pre-wrap; }
        .paper-link { display: inline-block; font-size: 0.85rem; color: #646cff; text-decoration: none; margin-bottom: 0.75rem; }
        .paper-link:hover { text-decoration: underline; }

        /* 답변 섹션 */
        .answers-section { margin-top: 1.5rem; }
        .answers-header { font-size: 1rem; font-weight: 600; color: var(--text-primary, #333); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        .answer-count-badge { background: #646cff; color: white; padding: 0.15rem 0.5rem; border-radius: 10px; font-size: 0.75rem; font-weight: 500; }
        .answer-card { background: var(--bg-dark, #f8f9fa); border-radius: 6px; padding: 1rem; margin-bottom: 0.75rem; }
        .answer-card.accepted { border-left: 3px solid #28a745; }
        .answer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .answer-meta { font-size: 0.85rem; color: var(--text-secondary, #888); display: flex; gap: 0.75rem; align-items: center; }
        .answer-content { color: var(--text-primary, #333); font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; }
        .accepted-badge { display: inline-block; padding: 0.15rem 0.4rem; background: #28a745; color: white; border-radius: 4px; font-size: 0.7rem; }

        /* 답변 작성 폼 */
        .answer-form { background: var(--bg-light, white); border: 1px solid var(--border-color, #ddd); border-radius: 8px; padding: 1.25rem; margin-top: 1rem; }
        .answer-form h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.75rem; }
        .answer-form textarea { width: 100%; min-height: 120px; padding: 0.75rem; border: 1px solid var(--border-color, #ddd); border-radius: 4px; font-size: 0.95rem; line-height: 1.5; resize: vertical; font-family: inherit; box-sizing: border-box; background: var(--bg-light, white); color: var(--text-primary, #333); }
        .answer-form textarea:focus { outline: none; border-color: #646cff; }
        .answer-form .form-actions { margin-top: 0.75rem; display: flex; justify-content: flex-end; }

        /* 액션 버튼 */
        .qa-actions { display: flex; gap: 0.25rem; margin-left: auto; }
        .qa-action-btn { padding: 0.3rem; font-size: 0.85rem; background: transparent; border: none; border-radius: 4px; color: var(--text-secondary, #888888); cursor: pointer; transition: all 0.2s; line-height: 1; }
        .qa-action-btn:hover { background: var(--bg-dark, #f0f0f0); color: var(--text-primary, #333333); }
        .qa-action-btn.delete:hover { background: rgba(255, 68, 68, 0.1); color: #ff4444; }

        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: #646cff; text-decoration: none; margin-bottom: 1rem; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }

        .empty-answers { text-align: center; padding: 2rem; color: var(--text-secondary, #888); }
        .login-prompt { text-align: center; padding: 1rem; color: var(--text-secondary, #666); }
        .login-prompt a { color: #646cff; }

        .accept-btn { padding: 0.25rem 0.5rem; font-size: 0.8rem; background: transparent; border: 1px solid #28a745; color: #28a745; border-radius: 4px; cursor: pointer; }
        .accept-btn:hover { background: #28a745; color: white; }

        /* 수정 모달 */
        .edit-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .edit-modal.show { display: flex; }
        .edit-modal-content { background: var(--bg-light, white); border-radius: 8px; padding: 1.5rem; width: 90%; max-width: 500px; }
        .edit-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .edit-modal-header h3 { margin: 0; font-size: 1.1rem; }
        .edit-modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-secondary, #888888); }
        .edit-modal textarea, .edit-modal input { width: 100%; padding: 0.75rem; border: 1px solid var(--border-color, #dddddd); border-radius: 4px; font-size: 1rem; box-sizing: border-box; background: var(--bg-light, white); color: var(--text-primary, #333); }
        .edit-modal textarea { min-height: 150px; resize: vertical; font-family: inherit; margin-bottom: 1rem; }
        .edit-modal input { margin-bottom: 0.75rem; }
        .edit-modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; }
    </style>
</head>
<body>
    <header id="header"></header>

    <main class="main-content">
        <div class="container">
            <a href="/qna.html" class="back-link">← Q&A 목록으로</a>

            <div class="qna-detail" id="qnaDetail">
                <div class="loading-spinner"></div>
            </div>
        </div>
    </main>

    <!-- Edit Modal -->
    <div class="edit-modal" id="editModal" onclick="closeEditModal(event)">
        <div class="edit-modal-content" onclick="event.stopPropagation()">
            <div class="edit-modal-header">
                <h3 id="editModalTitle">수정</h3>
                <button class="edit-modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <div id="editTitleContainer">
                <input type="text" id="editModalTitleInput" placeholder="질문 제목">
            </div>
            <textarea id="editModalTextarea" placeholder="내용을 입력해주세요..."></textarea>
            <div class="edit-modal-actions">
                <button class="btn btn-outline" onclick="closeEditModal()">취소</button>
                <button class="btn btn-primary" onclick="submitEdit()">수정 완료</button>
            </div>
        </div>
    </div>

    <footer id="footer"></footer>

    <script src="/js/common-layout.js?v=2"></script>
    <script src="/js/app.js?v=20"></script>
    <script>
        // currentUser는 app.js에서 전역으로 관리됨
        var questionData = null;
        var answersData = [];

        document.addEventListener('DOMContentLoaded', function() {
            var urlParams = new URLSearchParams(window.location.search);
            var questionId = urlParams.get('id');
            if (!questionId) {
                window.location.href = '/qna.html';
                return;
            }
            // app.js의 전역 currentUser 사용
            currentUser = JSON.parse(localStorage.getItem('user') || 'null');
            loadQuestionDetail(questionId);
            updateAuthUI();
        });

        function formatDateTime(dateString) {
            if (!dateString) return '';
            var date = new Date(dateString);
            var year = date.getFullYear();
            var month = String(date.getMonth() + 1).padStart(2, '0');
            var day = String(date.getDate()).padStart(2, '0');
            var hours = String(date.getHours()).padStart(2, '0');
            var minutes = String(date.getMinutes()).padStart(2, '0');
            return year + '.' + month + '.' + day + ' ' + hours + ':' + minutes;
        }

        function escapeQuotes(str) {
            if (!str) return '';
            return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n');
        }

        function canEditItem(itemUserId) {
            if (!currentUser) return false;
            var isAdmin = currentUser.role === 'admin';
            var isOwner = currentUser.id === itemUserId;
            return isOwner || isAdmin;
        }

        async function loadQuestionDetail(questionId) {
            var container = document.getElementById('qnaDetail');

            try {
                // 질문 로드
                var qResponse = await api('/community/questions/' + questionId);
                if (!qResponse.success || !qResponse.data) {
                    container.innerHTML = '<div class="empty-state"><h3>질문을 찾을 수 없습니다</h3><a href="/qna.html" class="btn btn-primary">Q&A 목록으로</a></div>';
                    return;
                }

                questionData = qResponse.data;
                document.title = questionData.title + ' - KoKive Q&A';

                // 답변 로드
                var aResponse = await api('/community/questions/' + questionId + '/answers');
                answersData = (aResponse.success && aResponse.data) ? aResponse.data : [];

                // 렌더링
                container.innerHTML = renderQuestionDetail();

            } catch (error) {
                console.error('질문 로드 오류:', error);
                container.innerHTML = '<div class="empty-state"><h3>질문을 불러올 수 없습니다</h3><p>잠시 후 다시 시도해주세요</p></div>';
            }
        }

        function renderQuestionDetail() {
            var q = questionData;
            var hasAnswers = answersData.length > 0;
            var questionUserId = q.userId;
            var canEdit = canEditItem(questionUserId);

            var html = '<div class="qna-card">';

            // 논문 링크
            if (q.paperTitle) {
                html += '<a href="/paper.html?id=' + q.paperId + '" class="paper-link">📄 ' + q.paperTitle + '</a>';
            }

            // 헤더
            html += '<div class="qna-header">';
            html += '<span class="qna-title">' + q.title + '</span>';
            html += hasAnswers ? '<span class="qna-badge answered">답변완료</span>' : '<span class="qna-badge pending">답변대기</span>';
            if (canEdit) {
                html += '<div class="qa-actions">';
                html += '<button class="qa-action-btn edit" onclick="openEditQuestionModal()" title="수정">✏️</button>';
                // 답변이 있으면 삭제 버튼 숨김
                if (!hasAnswers) {
                    html += '<button class="qa-action-btn delete" onclick="deleteQuestion()" title="삭제">🗑️</button>';
                }
                html += '</div>';
            }
            html += '</div>';

            // 메타
            html += '<div class="qna-meta">';
            html += '<span>👤 ' + (q.user && q.user.nickname ? q.user.nickname : '익명') + '</span>';
            html += '<span>📅 ' + formatDateTime(q.createdAt) + '</span>';
            html += '</div>';

            // 내용
            if (q.content) {
                html += '<div class="qna-content">' + q.content + '</div>';
            }

            html += '</div>';

            // 답변 섹션
            html += '<div class="answers-section">';
            html += '<div class="answers-header">💬 답변 <span class="answer-count-badge">' + answersData.length + '</span></div>';

            if (hasAnswers) {
                answersData.forEach(function(a) {
                    var answerUserId = a.userId;
                    var isAiAnswer = a.isAiGenerated === 1 || a.isAiGenerated === true;
                    var canEditAnswer = canEditItem(answerUserId);
                    var isQuestionOwner = currentUser && q.userId === currentUser.id;
                    // AI 답변은 수정 불가, 삭제는 소유자 또는 관리자만 가능
                    var canModifyAnswer = !isAiAnswer && canEditAnswer;

                    html += '<div class="answer-card ' + (a.isAccepted ? 'accepted' : '') + '">';
                    html += '<div class="answer-header">';
                    html += '<div class="answer-meta">';
                    html += '<span>👤 ' + (a.user && a.user.nickname ? a.user.nickname : '익명') + '</span>';
                    html += '<span>📅 ' + formatDateTime(a.createdAt) + '</span>';
                    if (a.isAccepted) {
                        html += '<span class="accepted-badge">✓ 채택됨</span>';
                    }
                    if (isAiAnswer) {
                        html += '<span class="accepted-badge" style="background: #646cff;">🤖 AI</span>';
                    }
                    html += '</div>';

                    // 답변 액션 (수정/삭제/채택)
                    html += '<div style="display: flex; gap: 0.5rem; align-items: center;">';
                    if (isQuestionOwner && !a.isAccepted) {
                        html += '<button class="accept-btn" onclick="acceptAnswer(' + a.id + ')">채택</button>';
                    }
                    // 수정은 AI 답변이 아닐 때만, 삭제는 권한이 있을 때만
                    if (canEditAnswer) {
                        html += '<div class="qa-actions">';
                        if (!isAiAnswer) {
                            html += '<button class="qa-action-btn edit" onclick="openEditAnswerModal(' + a.id + ', \'' + escapeQuotes(a.content) + '\')" title="수정">✏️</button>';
                        }
                        html += '<button class="qa-action-btn delete" onclick="deleteAnswer(' + a.id + ')" title="삭제">🗑️</button>';
                        html += '</div>';
                    }
                    html += '</div>';

                    html += '</div>';
                    html += '<div class="answer-content">' + a.content + '</div>';
                    html += '</div>';
                });
            } else {
                html += '<div class="empty-answers">아직 답변이 없습니다. 첫 번째 답변을 남겨보세요!</div>';
            }

            // 답변 작성 폼
            var token = localStorage.getItem('kokive_token');
            if (token) {
                html += '<div class="answer-form">';
                html += '<h3>답변 작성</h3>';
                html += '<textarea id="answerContent" placeholder="답변을 작성해주세요..."></textarea>';
                html += '<div class="form-actions">';
                html += '<button class="btn btn-primary" onclick="submitAnswer()">답변 등록</button>';
                html += '</div>';
                html += '</div>';
            } else {
                html += '<div class="login-prompt">답변을 작성하려면 <a href="/login.html?redirect=' + encodeURIComponent(window.location.href) + '">로그인</a>이 필요합니다.</div>';
            }

            html += '</div>';

            return html;
        }

        async function submitAnswer() {
            var content = document.getElementById('answerContent').value.trim();
            if (!content) {
                alert('답변 내용을 입력해주세요.');
                return;
            }

            var urlParams = new URLSearchParams(window.location.search);
            var questionId = urlParams.get('id');

            try {
                var response = await api('/community/questions/' + questionId + '/answers', {
                    method: 'POST',
                    body: JSON.stringify({ content: content })
                });

                if (response.success) {
                    alert('답변이 등록되었습니다.');
                    loadQuestionDetail(questionId);
                } else {
                    alert(response.error && response.error.message ? response.error.message : '답변 등록에 실패했습니다.');
                }
            } catch (error) {
                console.error('답변 등록 오류:', error);
                alert('답변 등록 중 오류가 발생했습니다.');
            }
        }

        async function acceptAnswer(answerId) {
            if (!confirm('이 답변을 채택하시겠습니까?')) return;

            try {
                var response = await api('/community/answers/' + answerId + '/accept', { method: 'POST' });
                if (response.success) {
                    alert('답변이 채택되었습니다.');
                    var urlParams = new URLSearchParams(window.location.search);
                    loadQuestionDetail(urlParams.get('id'));
                } else {
                    alert(response.error && response.error.message ? response.error.message : '채택에 실패했습니다.');
                }
            } catch (error) {
                console.error('답변 채택 오류:', error);
                alert('채택 중 오류가 발생했습니다.');
            }
        }

        // ===== 수정/삭제 기능 =====
        var currentEditType = null;
        var currentEditId = null;

        function openEditQuestionModal() {
            if (!questionData) return;
            currentEditType = 'question';
            currentEditId = questionData.id;

            document.getElementById('editModalTitle').textContent = '질문 수정';
            document.getElementById('editTitleContainer').style.display = 'block';
            document.getElementById('editModalTitleInput').value = questionData.title || '';
            document.getElementById('editModalTextarea').value = questionData.content || '';
            document.getElementById('editModal').classList.add('show');
        }

        function openEditAnswerModal(answerId, content) {
            currentEditType = 'answer';
            currentEditId = answerId;

            document.getElementById('editModalTitle').textContent = '답변 수정';
            document.getElementById('editTitleContainer').style.display = 'none';
            document.getElementById('editModalTextarea').value = content.replace(/\\n/g, '\n').replace(/\\'/g, "'").replace(/\\"/g, '"');
            document.getElementById('editModal').classList.add('show');
        }

        function closeEditModal(event) {
            if (!event || event.target === event.currentTarget) {
                document.getElementById('editModal').classList.remove('show');
                currentEditType = null;
                currentEditId = null;
                document.getElementById('editTitleContainer').style.display = 'block';
            }
        }

        async function submitEdit() {
            var content = document.getElementById('editModalTextarea').value.trim();
            if (!content) {
                alert('내용을 입력해주세요.');
                return;
            }

            if (!currentEditType || !currentEditId) {
                alert('수정 정보가 없습니다.');
                return;
            }

            try {
                var endpoint, body;
                if (currentEditType === 'question') {
                    var title = document.getElementById('editModalTitleInput').value.trim();
                    if (!title) {
                        alert('제목을 입력해주세요.');
                        return;
                    }
                    endpoint = '/community/questions/' + currentEditId;
                    body = { title: title, content: content };
                } else {
                    endpoint = '/community/answers/' + currentEditId;
                    body = { content: content };
                }

                var response = await api(endpoint, {
                    method: 'PUT',
                    body: JSON.stringify(body)
                });

                if (response.success) {
                    alert('수정되었습니다.');
                    closeEditModal();
                    var urlParams = new URLSearchParams(window.location.search);
                    loadQuestionDetail(urlParams.get('id'));
                } else {
                    alert(response.error && response.error.message ? response.error.message : '수정에 실패했습니다.');
                }
            } catch (error) {
                console.error('수정 오류:', error);
                alert('수정 중 오류가 발생했습니다.');
            }
        }

        async function deleteQuestion() {
            if (!confirm('정말 이 질문을 삭제하시겠습니까?')) return;

            var urlParams = new URLSearchParams(window.location.search);
            var questionId = urlParams.get('id');

            try {
                var response = await api('/community/questions/' + questionId, { method: 'DELETE' });
                if (response.success) {
                    alert('질문이 삭제되었습니다.');
                    window.location.href = '/qna.html';
                } else {
                    alert(response.error && response.error.message ? response.error.message : '삭제에 실패했습니다.');
                }
            } catch (error) {
                console.error('삭제 오류:', error);
                alert('삭제 중 오류가 발생했습니다.');
            }
        }

        async function deleteAnswer(answerId) {
            if (!confirm('정말 이 답변을 삭제하시겠습니까?')) return;

            try {
                var response = await api('/community/answers/' + answerId, { method: 'DELETE' });
                if (response.success) {
                    alert('답변이 삭제되었습니다.');
                    var urlParams = new URLSearchParams(window.location.search);
                    loadQuestionDetail(urlParams.get('id'));
                } else {
                    alert(response.error && response.error.message ? response.error.message : '삭제에 실패했습니다.');
                }
            } catch (error) {
                console.error('삭제 오류:', error);
                alert('삭제 중 오류가 발생했습니다.');
            }
        }
    </script>
</body>
</html>
